name: Build Plugin and Client Mods

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Plugin
        run: |
          cd Plugin
          PAPER="/tmp/paper-api-1.21.4.jar"
          FLOODGATE="../../floodgate-spigot.jar"
          mkdir -p build/classes build/resources
          cp src/main/resources/plugin.yml build/resources/
          cp src/main/resources/config.yml build/resources/
          javac -d build/classes \
            -cp "$PAPER:$FLOODGATE" \
            src/main/java/com/rexo/bedwars/optimizer/*.java 2>&1 | grep -E "error:" || true
          jar cf ../BedWarsOptimizer-1.1.0.jar -C build/classes . -C build/resources .

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Plugin
          path: Plugin/BedWarsOptimizer-1.1.0.jar
          retention-days: 1

  build-clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [Fabric, Forge, NeoForge, Quilt]
        version: ['1.21.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Common
        run: |
          COMMON="Mod/common/src/main/java"
          BUILD="build/common-${{ matrix.loader }}"
          mkdir -p "$BUILD"
          javac -d "$BUILD" $(find "$COMMON" -name "*.java")

      - name: Compile ${{ matrix.loader }} Loader
        run: |
          COMMON_BUILD="build/common-${{ matrix.loader }}"
          LOADER_SRC="Mod/Loaders/${{ matrix.loader }}/Versions/${{ matrix.version }}/src/main/java"
          BUILD="build/${{ matrix.loader }}-${{ matrix.version }}"
          mkdir -p "$BUILD"
          javac -cp "$COMMON_BUILD" -d "$BUILD" "$LOADER_SRC/com/rexo/bedwars/clienthelper/${{ matrix.loader,,}}/${{ matrix.loader }}ClientHelper.java"

      - name: Create ${{ matrix.loader }} JAR
        run: |
          COMMON_BUILD="build/common-${{ matrix.loader }}"
          BUILD="build/${{ matrix.loader }}-${{ matrix.version }}"
          mkdir -p build-artifacts
          cd "$BUILD"
          jar cf "../../../../build-artifacts/bedwars-optimizer-${{ matrix.loader }}.jar" com/

      - name: Copy Metadata
        run: |
          META="build-artifacts/"
          cp Mod/universal/fabric.mod.json "$META/fabric.mod.json"
          cp Mod/universal/mcmod.info "$META/mcmod.info"
          cp Mod/universal/neoforge.mod.json "$META/neoforge.mod.json"
          cp Mod/universal/quilt.mod.json "$META/quilt.mod.json"
          mkdir -p "$META/META-INF"
          cp Mod/universal/META-INF/mods.toml "$META/META-INF/"
          cp -r Mod/universal/assets "$META/"

      - name: Package ${{ matrix.loader }} JAR
        run: |
          META="build-artifacts/"
          jar cf "bedwars-optimizer-${{ matrix.loader }}.jar" -C "$META" .

      - name: Upload ${{ matrix.loader }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-${{ matrix.loader }}
          path: build-artifacts/bedwars-optimizer-${{ matrix.loader }}.jar
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [build-plugin, build-clients]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: List all JARs
        run: |
          find build-artifacts -name "*.jar" -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: BedWarsOptimizer v1.1.0
          draft: false
          prerelease: false
          delete: true
          body: |
            ## BedWarsOptimizer v1.1.0

            ### Main Feature: Health Display (Hypixel Style)
            Server sends health data to each client. The client of the player whose health is being displayed renders the number + hearts locally — offloading rendering from server tick loop.

            ### Fixed: Performance Issues with Bedrock Players
            Offloaded Geyser/Floodgate processing work to capable Java clients to prevent server slowdown when many Bedrock players join.

            ### Removed: Ping Equalization
            Ping hiding didn't work as intended. Removed in favor of stable features.

            ### Kicked: Old Mod Versions
            Clients without the v1.1.0 mod are disconnected until they update.

            ### Installation
            Place the appropriate JAR in your `mods` folder:
            - **Fabric**: `bedwars-optimizer-Fabric.jar`
            - **Forge**: `bedwars-optimizer-Forge.jar`
            - **NeoForge**: `bedwars-optimizer-NeoForge.jar`
            - **Quilt**: `bedwars-optimizer-Quilt.jar`

            **Server Plugin**: See `BedWarsOptimizer-1.1.0.jar`
          files: |
            build-artifacts/BedWarsOptimizer-1.1.0.jar
            build-artifacts/bedwars-optimizer-Fabric.jar
            build-artifacts/bedwars-optimizer-Forge.jar
            build-artifacts/bedwars-optimizer-NeoForge.jar
            build-artifacts/bedwars-optimizer-Quilt.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
