name: Build Plugin and Client Mods

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugin JAR
        run: |
          cd Plugin
          gradle build --no-daemon
          mkdir -p ../build-artifacts
          cp build/libs/BedWarsOptimizer-1.0.0.jar ../build-artifacts/

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Plugin
          path: build-artifacts/BedWarsOptimizer-1.0.0.jar
          retention-days: 1

  build-common:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Common Classes
        run: |
          mkdir -p build/classes/common
          javac -d build/classes/common \
            -sourcepath Mod/common/src/main/java \
            $(find Mod/common/src/main/java -name "*.java")

      - name: Create Common JAR
        run: |
          mkdir -p build-artifacts
          cd build/classes/common
          jar cf ../../build-artifacts/bedwars-optimizer-common.jar .

      - name: Upload Common Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Common
          path: build-artifacts/bedwars-optimizer-common.jar
          retention-days: 1

  build-clients:
    runs-on: ubuntu-latest
    needs: [build-plugin, build-common]
    strategy:
      matrix:
        include:
          # Fabric
          - loader: Fabric
            version: '1.14.x'
          - loader: Fabric
            version: '1.15.x'
          - loader: Fabric
            version: '1.16.x'
          - loader: Fabric
            version: '1.17.x'
          - loader: Fabric
            version: '1.18.x'
          - loader: Fabric
            version: '1.19.x'
          - loader: Fabric
            version: '1.20.x'
          - loader: Fabric
            version: '1.21.x'
          - loader: Fabric
            version: '26.1.x'
          - loader: Fabric
            version: '26.2.x'
          - loader: Fabric
            version: '26.3.x'
          # Forge (1.8.9 and 1.9.4 support lives under Forge)
          - loader: Forge
            version: '1.8.9'
          - loader: Forge
            version: '1.9.4'
          - loader: Forge
            version: '1.10.x'
          - loader: Forge
            version: '1.11.x'
          - loader: Forge
            version: '1.12.x'
          - loader: Forge
            version: '1.13.2'
          - loader: Forge
            version: '1.14.x'
          - loader: Forge
            version: '1.15.x'
          - loader: Forge
            version: '1.16.x'
          - loader: Forge
            version: '1.17.x'
          - loader: Forge
            version: '1.18.x'
          - loader: Forge
            version: '1.19.x'
          - loader: Forge
            version: '1.20.x'
          - loader: Forge
            version: '1.21.x'
          - loader: Forge
            version: '26.1.x'
          - loader: Forge
            version: '26.2.x'
          - loader: Forge
            version: '26.3.x'
          # NeoForge
          - loader: NeoForge
            version: '1.20.x'
          - loader: NeoForge
            version: '1.21.x'
          - loader: NeoForge
            version: '26.1.x'
          - loader: NeoForge
            version: '26.2.x'
          - loader: NeoForge
            version: '26.3.x'
          # Quilt
          - loader: Quilt
            version: '1.14.x'
          - loader: Quilt
            version: '1.15.x'
          - loader: Quilt
            version: '1.16.x'
          - loader: Quilt
            version: '1.17.x'
          - loader: Quilt
            version: '1.18.x'
          - loader: Quilt
            version: '1.19.x'
          - loader: Quilt
            version: '1.20.x'
          - loader: Quilt
            version: '1.21.x'
          - loader: Quilt
            version: '26.1.x'
          - loader: Quilt
            version: '26.2.x'
          - loader: Quilt
            version: '26.3.x'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Common JAR
        uses: actions/download-artifact@v4
        with:
          name: BedWarsOptimizer-Common

      - name: Compile ${{ matrix.loader }} ${{ matrix.version }}
        run: |
          mkdir -p build/classes/${{ matrix.loader }}-${{ matrix.version }}
          src_dir="Mod/Loaders/${{ matrix.loader }}/Versions/${{ matrix.version }}/src/main/java"
          if [ -d "$src_dir" ]; then
            javac -cp bedwars-optimizer-common.jar \
              -d build/classes/${{ matrix.loader }}-${{ matrix.version }} \
              -sourcepath "$src_dir" \
              $(find "$src_dir" -name "*.java")
          fi

      - name: Create ${{ matrix.loader }} JAR
        run: |
          mkdir -p build-artifacts
          class_dir="build/classes/${{ matrix.loader }}-${{ matrix.version }}"
          if [ -d "$class_dir/com" ]; then
            cd "$class_dir"
            jar cf "../../../../build-artifacts/bedwars-optimizer-${{ matrix.loader }}-${{ matrix.version }}.jar" .
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-${{ matrix.loader }}-${{ matrix.version }}
          path: build-artifacts/bedwars-optimizer-${{ matrix.loader }}-${{ matrix.version }}.jar
          retention-days: 1
        continue-on-error: true

  build-universal:
    runs-on: ubuntu-latest
    needs: build-clients
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download all client JARs
        uses: actions/download-artifact@v4
        with:
          pattern: 'BedWarsOptimizer-Fabric-*'
          path: client-jars
        continue-on-error: true

      - name: Download all client JARs (forge, neoforge, quilt)
        run: |
          mkdir -p client-jars
          for name in $(gh api repos/$GITHUB_REPOSITORY/actions/artifacts --jq '.artifacts[].name' | grep -E '^BedWarsOptimizer-(Forge|NeoForge|Quilt)-' || true); do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir client-jars
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Universal JAR
        run: |
          mkdir -p build/universal
          cd build/universal
          for jar in $(find ../../client-jars -name "bedwars-optimizer-*.jar"); do
            jar xf "$jar"
          done
          # Add metadata files for Modrinth compatibility
          mkdir -p META-INF
          cp ../../Mod/universal/fabric.mod.json .
          cp ../../Mod/universal/mcmod.info .
          cp ../../Mod/universal/neoforge.mod.json .
          cp ../../Mod/universal/quilt.mod.json .
          jar cf ../../build-artifacts/bedwars-optimizer-universal.jar .
          mkdir -p ../../build-artifacts
          mv ../../build-artifacts/bedwars-optimizer-universal.jar ../../build-artifacts/ 2>/dev/null || true

      - name: Upload Universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Universal
          path: build-artifacts/bedwars-optimizer-universal.jar
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [build-plugin, build-clients, build-universal]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: List all JARs
        run: |
          find build-artifacts -name "*.jar" -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: BedWarsOptimizer v1.0.0
          draft: false
          prerelease: false
          delete: true
          body: |
            ## BedWarsOptimizer Client Mod v1.0.0

            Improves server-client performance when joining the BedWars server.

            ### Features
            - Optimizes client-side processing to reduce lag spikes
            - Smoother gameplay during peak server load
            - Works across all major Minecraft mod loaders

            ### Universal JAR
            `bedwars-optimizer-universal.jar` contains all client helpers in one file
            (Fabric, Forge, NeoForge, Quilt). Place it in your \`mods\` folder.
            Older 1.8.9 / 1.9.4 clients can use the Forge JARs instead.

            ### Supported Versions

            **Fabric**
            - 1.14.x, 1.15.x, 1.16.x, 1.17.x, 1.18.x, 1.19.x, 1.20.x, 1.21.x
            - 26.1.x, 26.2.x, 26.3.x

            **Forge**
            - 1.8.9, 1.9.4, 1.10.x, 1.11.x, 1.12.x, 1.13.2
            - 1.14.x, 1.15.x, 1.16.x, 1.17.x, 1.18.x, 1.19.x, 1.20.x, 1.21.x
            - 26.1.x, 26.2.x, 26.3.x

            **NeoForge**
            - 1.20.x, 1.21.x
            - 26.1.x, 26.2.x, 26.3.x

            **Quilt**
            - 1.14.x, 1.15.x, 1.16.x, 1.17.x, 1.18.x, 1.19.x, 1.20.x, 1.21.x
            - 26.1.x, 26.2.x, 26.3.x

            ### Installation
            Place the appropriate JAR in your \`mods\` folder. The universal JAR
            works for all supported versions and loaders.

            ---
            **Server Plugin:** See \`BedWarsOptimizer-1.0.0.jar\` for the server-side plugin.
          files: |
            build-artifacts/BedWarsOptimizer-1.0.0.jar
            build-artifacts/bedwars-optimizer-universal.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
