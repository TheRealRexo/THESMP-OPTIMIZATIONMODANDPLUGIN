name: Build Plugin and Client Mods

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugin JAR
        run: |
          cd Plugin
          gradle build --no-daemon
          mkdir -p ../artifacts
          cp build/libs/BedWarsOptimizer-1.0.0.jar ../artifacts/

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Plugin
          path: artifacts/BedWarsOptimizer-1.0.0.jar

  build-client-common:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Common Client Classes
        run: |
          mkdir -p /tmp/build-client-common/classes
          javac -d /tmp/build-client-common/classes \
            -sourcepath Mod/common/src/main/java \
            $(find Mod/common/src/main/java -name "*.java")

      - name: Create Common JAR
        run: |
          cd /tmp/build-client-common/classes
          jar cf ../../../artifacts/bedwars-optimizer-common.jar .
          mkdir -p ../../../artifacts
        continue-on-error: true

      - name: Upload Common Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Common
          path: artifacts/bedwars-optimizer-common.jar
        continue-on-error: true

  build-fabric-client:
    runs-on: ubuntu-latest
    needs: build-client-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Fabric Client (1.21.x)
        run: |
          mkdir -p /tmp/build-fabric/classes
          javac -d /tmp/build-fabric/classes \
            -sourcepath Mod/Loaders/Fabric/Versions/1.21.x/src/main/java \
            $(find Mod/Loaders/Fabric/Versions/1.21.x/src/main/java -name "*.java") 2>/dev/null || echo "Fabric 1.21.x sources need dependencies"
        continue-on-error: true

      - name: Create Fabric JAR
        run: |
          mkdir -p artifacts
          if [ -d "/tmp/build-fabric/classes/com" ]; then
            cd /tmp/build-fabric/classes
            jar cf ../../../artifacts/bedwars-optimizer-fabric-1.21.x.jar .
          fi
        continue-on-error: true

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Fabric-1.21.x
          path: artifacts/bedwars-optimizer-fabric-1.21.x.jar
        continue-on-error: true

  build-forge-client:
    runs-on: ubuntu-latest
    needs: build-client-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Forge Client (1.21.x)
        run: |
          mkdir -p /tmp/build-forge/classes
          javac -d /tmp/build-forge/classes \
            -sourcepath Mod/Loaders/Forge/Versions/1.21.x/src/main/java \
            $(find Mod/Loaders/Forge/Versions/1.21.x/src/main/java -name "*.java") 2>/dev/null || echo "Forge 1.21.x sources need dependencies"
        continue-on-error: true

      - name: Create Forge JAR
        run: |
          mkdir -p artifacts
          if [ -d "/tmp/build-forge/classes/com" ]; then
            cd /tmp/build-forge/classes
            jar cf ../../../artifacts/bedwars-optimizer-forge-1.21.x.jar .
          fi
        continue-on-error: true

      - name: Upload Forge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Forge-1.21.x
          path: artifacts/bedwars-optimizer-forge-1.21.x.jar
        continue-on-error: true

  build-quilt-client:
    runs-on: ubuntu-latest
    needs: build-client-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Quilt Client (1.21.x)
        run: |
          mkdir -p /tmp/build-quilt/classes
          javac -d /tmp/build-quilt/classes \
            -sourcepath Mod/Loaders/Quilt/Versions/1.21.x/src/main/java \
            $(find Mod/Loaders/Quilt/Versions/1.21.x/src/main/java -name "*.java") 2>/dev/null || echo "Quilt 1.21.x sources need dependencies"
        continue-on-error: true

      - name: Create Quilt JAR
        run: |
          mkdir -p artifacts
          if [ -d "/tmp/build-quilt/classes/com" ]; then
            cd /tmp/build-quilt/classes
            jar cf ../../../artifacts/bedwars-optimizer-quilt-1.21.x.jar .
          fi
        continue-on-error: true

      - name: Upload Quilt Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-Quilt-1.21.x
          path: artifacts/bedwars-optimizer-quilt-1.21.x.jar
        continue-on-error: true

  build-liteloader-client:
    runs-on: ubuntu-latest
    needs: build-client-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile LiteLoader Client (1.8.9)
        run: |
          mkdir -p /tmp/build-liteloader/classes
          javac -d /tmp/build-liteloader/classes \
            -sourcepath Mod/Loaders/Forge/Versions/1.8.9/src/main/java \
            $(find Mod/Loaders/Forge/Versions/1.8.9/src/main/java -name "*.java") 2>/dev/null || echo "LiteLoader 1.8.9 sources need dependencies"
        continue-on-error: true

      - name: Create LiteLoader JAR
        run: |
          mkdir -p artifacts
          if [ -d "/tmp/build-liteloader/classes/com" ]; then
            cd /tmp/build-liteloader/classes
            jar cf ../../../artifacts/bedwars-optimizer-liteloader-1.8.9.jar .
          fi
        continue-on-error: true

      - name: Upload LiteLoader Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWarsOptimizer-LiteLoader-1.8.9
          path: artifacts/bedwars-optimizer-liteloader-1.8.9.jar
        continue-on-error: true

  release:
    runs-on: ubuntu-latest
    needs: [build-plugin, build-client-common, build-fabric-client, build-forge-client, build-quilt-client, build-liteloader-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: BedWarsOptimizer v1.0.0
          draft: false
          prerelease: false
          files: |
            artifacts/**/BedWarsOptimizer-*.jar
            artifacts/**/bedwars-optimizer-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
