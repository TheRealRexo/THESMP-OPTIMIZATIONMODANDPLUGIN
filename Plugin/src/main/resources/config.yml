# BedWarsOptimizer v1.1.0 Configuration
# CPU profiler + dynamic client-side load offload + health display.
# Java clients with the mod receive offloaded work and render health
# as a number + hearts over players (Hypixel BedWars style).
# Bedrock clients are handled server-side (no mod required, no kicking).

# --- Profiling ---
profile:
  interval-ticks: 20
  mode: both
  hot-threshold-ticks: 10
  entity-sample-size: 100
  entity:
    villagers: true
    monsters: true
    animals: true
    items: true
  tile-sample-size: 20
  tile:
    redstone: true
    hoppers: true
    mob-spawners: true
    signs: true

# --- Dynamic Load Offload ---
report:
  interval-seconds: 30
  client-cpu-threshold: 0.6
  offload-enabled: true
  max-offload-per-tick: 50
  poll-interval-seconds: 5

# --- Health Display ---
# Server sends HealthDisplayPackets to each client mod.
# The client of the player whose health is displayed does all the
# rendering (number + hearts) locally — offloads from server tick loop.
health-display:
  enabled: true
  interval-ticks: 2
  show-hearts: true
  show-number: true

# --- Geyser/Floodgate Offload ---
# When server is under heavy load and Bedrock players are online,
# offload some Geyser processing to capable Java clients.
floodgate-offload:
  enabled: true
  load-threshold: 0.7  # only offload when server load > 70%

# --- Auto-throttle (safe — only changes view/sim distance) ---
auto-throttle:
  enabled: true
  tps-threshold: 18.0
  ram-threshold-percent: 80

# --- TNT void restriction (safe — prevents TNT gadget exploits) ---
tnt-void:
  restrict: true
  void-threshold-y: 16
  blast-radius: 5.0